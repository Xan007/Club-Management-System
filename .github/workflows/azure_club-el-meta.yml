# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - club-el-meta

on:
  push:
    branches:
      - azure
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Install production dependencies in build folder
        working-directory: ./backend/build
        run: npm ci --omit="dev"

      - name: Install Puppeteer Chromium in build folder
        working-directory: ./backend/build
        run: |
          mkdir -p .cache/puppeteer
          PUPPETEER_CACHE_DIR=.cache/puppeteer npx puppeteer browsers install chrome || echo "Chromium install completed"
      
      - name: Copy web.config to build folder
        working-directory: ./backend
        run: cp web.config build/web.config

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_530545F87EFB409EB12C07B9B57C14C7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CB63DDFB7F274979BFB13A3A75E0CFEC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_960F02193C8C480D89E429F8693F8C43 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'club-el-meta'
          slot-name: 'Production'
          package: .
